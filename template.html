<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 650px;
    margin: 40px auto;
    padding: 0 10px;
    font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #444;
    background: #fff;
  }
  h1, h2, h3 { line-height: 1.2; }
  a { color: #07a; }
  a:visited { color: #941352; }
  img { max-width: 100%; height: auto; }
  img.me { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
  .intro { display: flex; align-items: center; gap: 20px; margin: 1em 0; }
  .intro h1, .intro p { margin: 0; }
  pre { overflow-x: auto; padding: 10px; background: #f4f4f4; }
  code { font-size: 0.9em; }
  nav a { margin-right: 1em; white-space: nowrap; }
  .meta { color: #777; font-size: 0.85em; }
  .posts { list-style: none; padding: 0; }
  @media (prefers-color-scheme: dark) {
    body { color: #c9d1d9; background: #0d1117; }
    a { color: #58a6ff; }
    a:visited { color: #8e96f0; }
    pre { background: #161b22; }
    .meta { color: #8b949e; }
  }
</style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/writing/">Writing</a>
  <a href="/files/resume.pdf">Resume</a>
  <a href="https://github.com/PMPiper">GitHub</a>
  <a href="https://www.linkedin.com/in/patrick-m-piper">LinkedIn</a>
</nav>
<main>
$content
</main>
</body>
</html>
